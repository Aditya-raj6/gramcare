spring.application.name=sanitation-service
server.port=8084

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/gramcare_sanitation
spring.datasource.username=${DB_USERNAME:postgres}
# Placeholder only. Set the DB_PASSWORD environment variable (or edit locally, without committing).
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Hide stack traces from API error responses
server.error.include-stacktrace=never
server.error.include-message=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Action Tracking Service, used to create a linked action item whenever a
# complaint or water-quality problem is reported.
action-service.base-url=http://localhost:8085

logging.level.com.gramcare=INFO
