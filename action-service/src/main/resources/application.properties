spring.application.name=action-service
server.port=8085

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/gramcare_action
spring.datasource.username=${DB_USERNAME:postgres}
# Placeholder only. Set the DB_PASSWORD environment variable (or edit locally, without committing).
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Hide stack traces from API error responses
server.error.include-stacktrace=never
server.error.include-message=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Downstream services this dashboard aggregates data from. Each call is
# resilient: if a service is unreachable, its contribution to the summary is
# reported as zero/unavailable rather than failing the whole dashboard.
resident-service.base-url=http://localhost:8081
inventory-service.base-url=http://localhost:8083
sanitation-service.base-url=http://localhost:8084
appointment-camp-service.base-url=http://localhost:8082

logging.level.com.gramcare=INFO
