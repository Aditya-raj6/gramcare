spring.application.name=resident-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/gramcare_resident
spring.datasource.username=${DB_USERNAME:postgres}
# Placeholder only. Set the DB_PASSWORD environment variable (or edit locally, without committing).
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Hide stack traces from API error responses
server.error.include-stacktrace=never
server.error.include-message=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.com.gramcare=INFO
