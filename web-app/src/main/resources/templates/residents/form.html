<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>GramCare — Resident Form</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar(${resident.id} != null ? 'Edit Resident' : 'Add Resident')}"></div>
    <div class="content">
      <div class="card" style="max-width:700px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post"
              th:action="${resident.id} != null ? @{'/residents/' + ${resident.id}} : @{/residents}">
          <div class="form-grid">
            <div class="form-group">
              <label>Full name *</label>
              <input type="text" name="fullName" required="required" th:value="${resident.fullName}"/>
            </div>
            <div class="form-group">
              <label>Village *</label>
              <input type="text" name="village" required="required" th:value="${resident.village}"/>
            </div>
            <div class="form-group">
              <label>Date of birth</label>
              <input type="date" name="dateOfBirth" th:value="${resident.dateOfBirth}"/>
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select name="gender">
                <option value="">Select</option>
                <option value="MALE" th:selected="${resident.gender == 'MALE'}">Male</option>
                <option value="FEMALE" th:selected="${resident.gender == 'FEMALE'}">Female</option>
                <option value="OTHER" th:selected="${resident.gender == 'OTHER'}">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Contact phone</label>
              <input type="text" name="contactPhone" th:value="${resident.contactPhone}"/>
            </div>
            <div class="form-group">
              <label>Blood group</label>
              <input type="text" name="bloodGroup" th:value="${resident.bloodGroup}"/>
            </div>
          </div>
          <div class="form-group">
            <label>Household address</label>
            <input type="text" name="householdAddress" th:value="${resident.householdAddress}"/>
          </div>
          <div class="form-group">
            <label>Known allergies</label>
            <textarea name="knownAllergies" rows="2" th:text="${resident.knownAllergies}"></textarea>
          </div>
          <div class="form-group">
            <label>Chronic conditions</label>
            <textarea name="chronicConditions" rows="2" th:text="${resident.chronicConditions}"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn" type="submit">Save Resident</button>
            <a class="btn secondary" href="/residents">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
