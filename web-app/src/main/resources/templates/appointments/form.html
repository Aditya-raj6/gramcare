<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>GramCare — Schedule Appointment</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Schedule Appointment')}"></div>
    <div class="content">
      <div th:replace="~{fragments/layout :: serviceErrorBanner}"></div>
      <div class="card" style="max-width:700px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post" th:action="@{/appointments}">
          <div class="form-grid">
            <div class="form-group">
              <label>Resident *</label>
              <select name="residentId" required="required">
                <option value="">Select resident</option>
                <option th:each="r : ${residents}" th:value="${r.id}" th:text="${r.fullName} + ' — ' + ${r.village}"></option>
              </select>
            </div>
            <div class="form-group">
              <label>Health centre</label>
              <select name="healthCentreId">
                <option value="">Not specified</option>
                <option th:each="c : ${centres}" th:value="${c.id}" th:text="${c.name}"></option>
              </select>
            </div>
            <div class="form-group">
              <label>Date &amp; time *</label>
              <input type="datetime-local" name="appointmentDateTime" required="required"/>
            </div>
          </div>
          <div class="form-group"><label>Reason for visit</label><input type="text" name="reason"/></div>
          <div class="btn-row">
            <button class="btn" type="submit">Schedule</button>
            <a class="btn secondary" href="/appointments">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
