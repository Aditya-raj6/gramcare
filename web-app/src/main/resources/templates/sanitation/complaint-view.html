<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>GramCare — Complaint</title><link rel="stylesheet" th:href="@{/css/styles.css}"/></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Complaint Details')}"></div>
    <div class="content">
      <div th:replace="~{fragments/layout :: serviceErrorBanner}"></div>
      <div th:if="${complaint != null}">
        <div class="alert alert-warning" th:if="${complaint.actionItemId == null}">
          This complaint is saved, but it is <strong>not yet linked</strong> to the Action Centre (the Action Tracking Service was unreachable when it was reported).
          <form method="post" th:action="@{'/sanitation/complaints/' + ${complaint.id} + '/retry-link'}" style="display:inline;">
            <button class="btn secondary" type="submit">Retry link</button>
          </form>
        </div>
        <div class="card">
          <h2 th:text="${complaint.title}"></h2>
          <p th:text="${complaint.description}"></p>
          <p><strong>Reported by:</strong> <span th:text="${complaint.reportedBy}"></span> &nbsp;
             <strong>Priority:</strong> <span th:text="${complaint.priority}"></span> &nbsp;
             <strong>Status:</strong> <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></p>
          <p th:if="${complaint.actionItemId != null}"><a th:href="@{'/actions/' + ${complaint.actionItemId}}">View linked action item</a></p>
          <p th:if="${complaint.closureNotes}"><strong>Closure notes:</strong> <span th:text="${complaint.closureNotes}"></span></p>
        </div>
        <div class="card">
          <h3>Update maintenance progress</h3>
          <form method="post" th:action="@{'/sanitation/complaints/' + ${complaint.id} + '/status'}">
            <div class="form-grid">
              <div class="form-group"><label>Status</label>
                <select name="status">
                  <option th:each="s : ${actionStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == complaint.status}"></option>
                </select>
              </div>
              <div class="form-group"><label>Assigned sanitation worker</label><input type="text" name="assignedWorker" th:value="${complaint.assignedWorker}"/></div>
            </div>
            <div class="form-group"><label>Closure / progress notes</label><textarea name="closureNotes" rows="2" th:text="${complaint.closureNotes}"></textarea></div>
            <button class="btn" type="submit">Update</button>
          </form>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
