<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>GramCare — Report Complaint</title><link rel="stylesheet" th:href="@{/css/styles.css}"/></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Report Sanitation Complaint')}"></div>
    <div class="content">
      <div th:replace="~{fragments/layout :: serviceErrorBanner}"></div>
      <div class="card" style="max-width:700px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post" th:action="@{/sanitation/complaints}">
          <div class="form-group"><label>Facility</label>
            <select name="facilityId">
              <option value="">Not linked to a registered facility</option>
              <option th:each="f : ${facilities}" th:value="${f.id}" th:text="${f.facilityName} + ' — ' + ${f.village}"></option>
            </select>
          </div>
          <div class="form-group"><label>Title *</label><input type="text" name="title" required="required" placeholder="e.g. Public toilet requires maintenance"/></div>
          <div class="form-group"><label>Description</label><textarea name="description" rows="3"></textarea></div>
          <div class="form-grid">
            <div class="form-group"><label>Reported by</label><input type="text" name="reportedBy" th:value="${demoRole}"/></div>
            <div class="form-group"><label>Priority</label>
              <select name="priority"><option value="LOW">Low</option><option value="MEDIUM" selected="selected">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select>
            </div>
          </div>
          <p class="hint" style="font-size:0.8rem;color:#5b6b7c;">Submitting creates the complaint and a linked item in the Unified Action Centre.</p>
          <div class="btn-row"><button class="btn" type="submit">Submit Complaint</button><a class="btn secondary" href="/sanitation">Cancel</a></div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
