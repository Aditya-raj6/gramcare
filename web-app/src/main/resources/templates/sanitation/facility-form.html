<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>GramCare — Register Facility</title><link rel="stylesheet" th:href="@{/css/styles.css}"/></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Register Sanitation Facility')}"></div>
    <div class="content">
      <div class="card" style="max-width:650px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post" th:action="@{/sanitation/facilities}">
          <div class="form-grid">
            <div class="form-group"><label>Facility name *</label><input type="text" name="facilityName" required="required"/></div>
            <div class="form-group"><label>Village *</label><input type="text" name="village" required="required"/></div>
            <div class="form-group"><label>Type</label>
              <select name="facilityType">
                <option value="PUBLIC_TOILET">Public toilet</option>
                <option value="COMMUNITY_TOILET_BLOCK">Community toilet block</option>
                <option value="WATER_SUPPLY_POINT">Water supply point</option>
                <option value="WASTE_COLLECTION_POINT">Waste collection point</option>
                <option value="DRAINAGE">Drainage</option>
              </select>
            </div>
            <div class="form-group"><label>Location</label><input type="text" name="location"/></div>
          </div>
          <div class="btn-row"><button class="btn" type="submit">Save Facility</button><a class="btn secondary" href="/sanitation">Cancel</a></div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
