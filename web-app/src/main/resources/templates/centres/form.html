<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>GramCare — Register Health Centre</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Register Health Centre')}"></div>
    <div class="content">
      <div class="card" style="max-width:700px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post" th:action="@{/centres}">
          <div class="form-grid">
            <div class="form-group"><label>Centre name *</label><input type="text" name="name" required="required"/></div>
            <div class="form-group"><label>Village *</label><input type="text" name="village" required="required"/></div>
            <div class="form-group">
              <label>Centre type</label>
              <select name="centreType">
                <option value="PRIMARY_HEALTH_CENTRE">Primary Health Centre</option>
                <option value="SUB_CENTRE">Sub Centre</option>
                <option value="COMMUNITY_HEALTH_CENTRE">Community Health Centre</option>
                <option value="MOBILE_UNIT">Mobile Unit</option>
              </select>
            </div>
            <div class="form-group"><label>Contact phone</label><input type="text" name="contactPhone"/></div>
            <div class="form-group"><label>Contact email</label><input type="email" name="contactEmail"/></div>
          </div>
          <div class="form-group"><label>Address</label><input type="text" name="address"/></div>
          <div class="btn-row">
            <button class="btn" type="submit">Save Health Centre</button>
            <a class="btn secondary" href="/centres">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
