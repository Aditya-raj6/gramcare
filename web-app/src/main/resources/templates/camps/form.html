<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>GramCare — Schedule Health Camp</title><link rel="stylesheet" th:href="@{/css/styles.css}"/></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="main-area">
    <div th:replace="~{fragments/layout :: topbar('Schedule Health Camp')}"></div>
    <div class="content">
      <div class="card" style="max-width:650px;">
        <div class="alert alert-error form-validation-banner" style="display:none;"></div>
        <form class="validated-form" method="post" th:action="@{/camps}">
          <div class="form-grid">
            <div class="form-group"><label>Camp name *</label><input type="text" name="campName" required="required"/></div>
            <div class="form-group"><label>Village *</label><input type="text" name="village" required="required"/></div>
            <div class="form-group"><label>Camp date</label><input type="date" name="campDate"/></div>
            <div class="form-group"><label>Location</label><input type="text" name="location"/></div>
          </div>
          <div class="btn-row">
            <button class="btn" type="submit">Save Camp</button>
            <a class="btn secondary" href="/camps">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
